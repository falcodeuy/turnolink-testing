# Add under mcp_servers: in Hermes config.yaml
#
# Playwright MCP runs on the host that serves the TurnoLink stack
# (npm run mcp:hermes). Point url at that host’s LAN IP — never localhost
# from inside a Hermes container (that would be the container itself).
# Match HERMES_ALLOWED_HOSTS in turnolink-testing/.env (see .env.example).
# If curl returns 403, the Host header is not allowlisted.

mcp_servers:
  playwright:
    url: "http://HOST_LAN_IP:8931/mcp"
    enabled: true
    timeout: 180
    connect_timeout: 60
